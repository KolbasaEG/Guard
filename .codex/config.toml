# Проектные роли обнаруживаются в .codex/agents/*.toml.
# Модель и уровень рассуждений задаются в файлах ролей.
# Разрешения и sandbox сохраняют настройки основной сессии.
# Цепочка AGENTS.md занимает около 44 КиБ; запас для вложенных инструкций.
project_doc_max_bytes = 65536

[agents]
enabled = true
max_concurrent_threads_per_session = 2
